[package]
name = "esr-app"
description = "Explorer Session Restore executable (esr.exe): wiring, threads, UI, install/uninstall."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The library holds the port traits (`ports`) so that `esr-sim` can implement
# them; the binary is `esr.exe`.
[lib]
name = "esr_app"
path = "src/lib.rs"

[[bin]]
name = "esr"
path = "src/main.rs"

[dependencies]
esr-core.workspace = true
esr-win.workspace = true

[dev-dependencies]
proptest.workspace = true

[dev-dependencies.windows]
# Used only by the `#[ignore]` integration tests: restore timing / visual
# cleanliness (`tests/restore_timing.rs`: DWMWA_CLOAKED sampling, process
# handle and memory counts) and startup (`tests/startup_coexistence.rs`:
# inspecting the test logon task).
#
# `tests/tab_folding.rs` also includes `esr-win`'s `tests/common/fold_spike.rs`
# (WinEvent hook, UI Automation, SAFEARRAY navigation helpers).
workspace = true
features = [
    "Win32_Graphics_Dwm",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_TaskScheduler",
    "Win32_UI_Accessibility",
]

[dependencies.windows]
workspace = true
features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]
